name: Update unassociated EMBER summaries

on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: ${{ vars.EMBER_S3_LOG_BASE_PATH }}
  ENV_PATH: "${{ vars.EMBER_S3_LOG_BASE_PATH }}/${{ vars.S3LOGS_ENV_NAME }}"
  UV_PATH: "${{ vars.EMBER_S3_LOG_BASE_PATH }}/uv"
  FLOCK_FILE: "${{ vars.EMBER_S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock"
  # Unassociated content is whatever this cache does not map, so DANDI's default would leave all of EMBER unassociated.
  CONTENT_ID_TO_USAGE_DANDISET_PATH_URL: ${{ vars.CONTENT_ID_TO_USAGE_DANDISET_PATH_URL }}
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  # Requesters are geolocated while the summaries are generated, against the GeoLite2 database
  MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
  MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Validate required variables
        run: |
          [ -n "${{ vars.EMBER_S3_LOG_BASE_PATH }}" ] || { echo "Repository variable EMBER_S3_LOG_BASE_PATH must be set."; exit 1; }
          [ -n "${{ vars.S3LOGS_ENV_NAME }}" ] || { echo "Repository variable S3LOGS_ENV_NAME must be set."; exit 1; }
          [ -n "${{ vars.CONTENT_ID_TO_USAGE_DANDISET_PATH_URL }}" ] || { echo "Repository variable CONTENT_ID_TO_USAGE_DANDISET_PATH_URL must be set."; exit 1; }

      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,ember
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateEmberSummaries:
    needs: CheckTyphon
    name: Update EMBER summaries
    runs-on: [self-hosted, typhon, ember]
    timeout-minutes: 4320  # 3 days

    steps:
      - name: Generate unassociated summaries
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v2
        with:
          command: update summaries
          flags: --unassociated --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --content-id-to-usage-dandiset-path-url ${{ env.CONTENT_ID_TO_USAGE_DANDISET_PATH_URL }}
          flock-file: ${{ env.FLOCK_FILE }}
          env-path: ${{ env.ENV_PATH }}
          uv-path: ${{ env.UV_PATH }}
          entrypoint: 'dandis3logextraction'

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, UpdateEmberSummaries]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "EMBER unassociated usage summaries update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/ember-usage-runner/actions/workflows/name-update+unassociated+summaries_archive-ember_runner-typhon_trigger-cron+dispatch_freq-daily.yml
