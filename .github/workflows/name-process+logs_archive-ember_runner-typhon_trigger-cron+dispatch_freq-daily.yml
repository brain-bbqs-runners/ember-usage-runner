name: Process EMBER logs

on:
  schedule:
    - cron: "0 10 * * *"  # ~6am ET
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONDA_BASE_PATH: "/data/ember/s3-logs/conda"
  CONDA_ENV_NAME: "s3_logs_cron"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  # Requesters are geolocated while the summaries are generated, against the GeoLite2 database
  MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
  MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Cancel if offline
        uses: ./.github/actions/check-runner
        with:
          org: brain-bbqs-runners/ember-usage-runner
          labels: typhon,ember
          token: ${{ secrets._GITHUB_API_KEY }}

  ProcessAccessLogs:
    needs: CheckTyphon
    name: Process access logs
    runs-on: [self-hosted, typhon, ember]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run primary S3 log extraction
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: extract s3://ember-open-data-logs/650477180493/us-east-1/ember-open-data
          flags: --mode dandi-remote --manifest /data/ember/s3-logs/extraction_cache/manifest_parsed.json
          flock_file: /data/ember/s3-logs/flocks/s3logextraction.lock

      - name: Generate Dandiset summaries
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update summaries
          flags: --mode dandi --api-url https://api-dandi.emberarchive.org/api
          flock_file: /data/ember/s3-logs/flocks/s3logextraction.lock

      - name: Generate archive summaries
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update summaries
          flags: --mode archive
          flock_file: /data/ember/s3-logs/flocks/s3logextraction.lock

      # Reads the region labels out of the published `by_region.tsv` files, so it has to follow the summaries
      - name: Update region coordinates
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update ip coordinates
          flock_file: /data/ember/s3-logs/flocks/s3logextraction.lock

      - name: Generate Dandiset totals
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update totals
          flags: --mode dandi
          flock_file: /data/ember/s3-logs/flocks/s3logextraction.lock

      - name: Generate archive totals
        uses: ./.github/actions/run-s3logextraction-command
        with:
          command: update totals
          flags: --mode archive
          flock_file: /data/ember/s3-logs/flocks/s3logextraction.lock

      - name: Upload summaries
        uses: ./.github/actions/upload-summaries
        with:
          extraction_cache_path: /data/ember/s3-logs/extraction_cache
          repository_path: /data/ember/s3-logs/ember-dandi-access-summaries

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, ProcessAccessLogs]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "EMBER access log extraction update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/ember-usage-runner/actions/workflows/name-process+logs_archive-ember_runner-typhon_trigger-cron+dispatch_freq-daily.yml
