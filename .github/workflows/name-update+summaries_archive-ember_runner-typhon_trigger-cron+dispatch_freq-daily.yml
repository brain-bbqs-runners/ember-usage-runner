name: Update EMBER summaries

on:
  schedule:
    - cron: "0 16 * * 0/3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: "/mnt/s3-logs/ember-s3-logs"
  DANDI_API_URL: "https://api-dandi.emberarchive.org/api"
  # Content IDs are mapped to Dandisets through EMBER's own cache, published by ember-cache. The plugin's default
  # is DANDI's, which holds no EMBER content, so with it every EMBER Dandiset would summarize as empty.
  CONTENT_ID_TO_USAGE_DANDISET_PATH_URL: "https://raw.githubusercontent.com/ember-cache/content-id-to-usage-dandiset-path/refs/heads/dist/derivatives/content_id_to_usage_dandiset_path.jsonl.gz"
  S3_LOG_EXTRACTION_PASSWORD: ${{ secrets.S3_LOG_EXTRACTION_PASSWORD }}
  # Requesters are geolocated while the summaries are generated, against the GeoLite2 database
  MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
  MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Validate required secrets
        env:
          SUMMARIES_REPOSITORY_TOKEN: ${{ secrets.SUMMARIES_REPOSITORY_TOKEN }}
        run: |
          [ -n "$MAXMIND_ACCOUNT_ID" ] || { echo "Repository secret MAXMIND_ACCOUNT_ID must be set."; exit 1; }
          [ -n "$MAXMIND_LICENSE_KEY" ] || { echo "Repository secret MAXMIND_LICENSE_KEY must be set."; exit 1; }
          [ -n "$SUMMARIES_REPOSITORY_TOKEN" ] || { echo "Repository secret SUMMARIES_REPOSITORY_TOKEN must be set."; exit 1; }

      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,ember
          token: ${{ secrets._GITHUB_API_KEY }}

  UpdateEmberSummaries:
    needs: CheckTyphon
    name: Update EMBER summaries
    runs-on: [self-hosted, typhon, ember]
    timeout-minutes: 2880  # 48 hours

    steps:
      - name: Generate Dandiset summaries
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v3
        with:
          command: update summaries
          flags: --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --api-url ${{ env.DANDI_API_URL }} --content-id-to-usage-dandiset-path-url ${{ env.CONTENT_ID_TO_USAGE_DANDISET_PATH_URL }}
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv
          entrypoint: 'dandis3logextraction'

      - name: Generate archive summaries
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v3
        with:
          command: update summaries
          flags: --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --mode archive --asset-types-in-order Neurophysiology,Microscopy,Video,Miscellaneous
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv

      # Reads the region labels out of the published `by_region.tsv` files, so it has to follow the summaries.
      # Runs through the default `s3logextraction` entrypoint, which `dandis3logextraction` does not re-expose.
      - name: Update region coordinates
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v3
        with:
          command: update ip coordinates --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --encryption false
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv

      - name: Generate Dandiset totals
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v3
        with:
          command: update totals
          flags: --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv

      - name: Generate archive totals
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v3
        with:
          command: update totals
          flags: --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --mode archive
          flock-file: ${{ env.S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock
          env-path: ${{ env.S3_LOG_BASE_PATH }}/env
          uv-path: ${{ env.S3_LOG_BASE_PATH }}/uv

      # Git pushes over HTTPS with the token, which a credential helper reads from this step's environment, so it is
      # never written to the clone. The empty helper drops any the runner user has, and an SSH remote, as an older
      # clone may have, is rewritten to HTTPS so it uses the token too. A prompt never shows in the log and waits
      # forever, so git is told not to prompt, and the timeout bounds any other stall.
      - name: Upload summaries
        uses: CodyCBakerPhD/dandi-s3-logs-action/upload-summaries@v3
        timeout-minutes: 60
        env:
          SUMMARIES_REPOSITORY_TOKEN: ${{ secrets.SUMMARIES_REPOSITORY_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "3"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!f() { if [ "$1" = get ]; then printf "username=x-access-token\npassword=%s\n" "$SUMMARIES_REPOSITORY_TOKEN"; fi; }; f'
          GIT_CONFIG_KEY_2: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_2: "git@github.com:"
        with:
          extraction-cache-path: ${{ env.S3_LOG_BASE_PATH }}/extraction_cache
          repository-path: ${{ env.S3_LOG_BASE_PATH }}/ember-dandi-access-summaries
          repository-url: https://github.com/aplbrain/ember-dandi-access-summaries.git

  NotifyOnFailure:
    # A job that times out, or waits a day in the queue for the runner, ends as cancelled rather than failed
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs: [CheckTyphon, UpdateEmberSummaries]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "EMBER access summaries update failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/ember-usage-runner/actions/workflows/name-update+summaries_archive-ember_runner-typhon_trigger-cron+dispatch_freq-daily.yml
