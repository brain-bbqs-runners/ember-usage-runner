name: Run EMBER log extraction

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  S3_LOG_BASE_PATH: ${{ vars.EMBER_S3_LOG_BASE_PATH }}
  ENV_PATH: "${{ vars.EMBER_S3_LOG_BASE_PATH }}/${{ vars.S3LOGS_ENV_NAME }}"
  UV_PATH: "${{ vars.EMBER_S3_LOG_BASE_PATH }}/uv"
  FLOCK_FILE: "${{ vars.EMBER_S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock"
  IPS_TO_SKIP: ${{ secrets.IPS_TO_SKIP }}
  DUCT_OUTPUT_PREFIX: "${{ vars.EMBER_S3_LOG_BASE_PATH }}/extraction_cache/.duct/{datetime}"

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Validate required variables
        run: |
          [ -n "${{ vars.EMBER_S3_LOG_BASE_PATH }}" ] || { echo "Repository variable EMBER_S3_LOG_BASE_PATH must be set."; exit 1; }
          [ -n "${{ vars.S3LOGS_ENV_NAME }}" ] || { echo "Repository variable S3LOGS_ENV_NAME must be set."; exit 1; }

      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,ember
          token: ${{ secrets._GITHUB_API_KEY }}

  ProcessAccessLogs:
    needs: CheckTyphon
    name: Process access logs
    runs-on: [self-hosted, typhon, ember]
    timeout-minutes: 2880  # 48 hours

    steps:
      # The EMBER bucket has no S3 Inventory, so the logs are listed live through its year/month/day prefixes.
      - name: Run primary S3 log extraction
        uses: CodyCBakerPhD/dandi-s3-logs-action/run-command@v2
        with:
          command: extract s3://ember-open-data-logs/650477180493/us-east-1/ember-open-data
          flags: --mode remote --cache ${{ env.S3_LOG_BASE_PATH }}/extraction_cache --limit 1000000
          flock-file: ${{ env.FLOCK_FILE }}
          env-path: ${{ env.ENV_PATH }}
          uv-path: ${{ env.UV_PATH }}
          entrypoint: 'dandis3logextraction'

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, ProcessAccessLogs]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "EMBER log extraction failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The scheduled run of S3 log extraction updates encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/ember-usage-runner/actions/workflows/name-run+extraction_archive-ember_runner-typhon_trigger-cron+dispatch_freq-daily.yml
