# Manual setup and upgrade of the EMBER runner environment.
#
# The recurring pipelines deliberately do not install anything, so that a scheduled run never picks up
# a new version mid-flight. Dispatch this workflow to create the environment the first time, to roll out
# new package versions, or with `recreate` to rebuild the environment from scratch.
name: Install EMBER extraction packages

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: Delete the environment and create it again, even if it already runs Python 3.14
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ENV_PATH: "${{ vars.EMBER_S3_LOG_BASE_PATH }}/${{ vars.S3LOGS_ENV_NAME }}"
  UV_PATH: "${{ vars.EMBER_S3_LOG_BASE_PATH }}/uv"
  FLOCK_FILE: "${{ vars.EMBER_S3_LOG_BASE_PATH }}/flocks/s3logextraction.lock"

jobs:
  CheckTyphon:
    name: Pre-run Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate required variables
        run: |
          [ -n "${{ vars.EMBER_S3_LOG_BASE_PATH }}" ] || { echo "Repository variable EMBER_S3_LOG_BASE_PATH must be set."; exit 1; }
          [ -n "${{ vars.S3LOGS_ENV_NAME }}" ] || { echo "Repository variable S3LOGS_ENV_NAME must be set."; exit 1; }

      - name: Cancel if offline
        uses: CodyCBakerPhD/check-runner-action@v1
        with:
          labels: typhon,ember
          token: ${{ secrets._GITHUB_API_KEY }}

  InstallPackages:
    needs: CheckTyphon
    name: Install packages
    runs-on: [self-hosted, typhon, ember]

    steps:
      - name: Install packages
        uses: CodyCBakerPhD/dandi-s3-logs-action/install-packages@v2
        with:
          env-path: ${{ env.ENV_PATH }}
          uv-path: ${{ env.UV_PATH }}
          flock-file: ${{ env.FLOCK_FILE }}
          recreate: ${{ inputs.recreate }}

  NotifyOnFailure:
    if: ${{ always() && failure() }}  # 'always' for if any 'needs' are cancelled/skipped
    needs: [CheckTyphon, InstallPackages]
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "EMBER extraction package install failed (Typhon CRON)"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: Typhon CRON <${{ secrets.MAIL_USERNAME }}>
          body: |
            The manual package install encountered an issue, please check status at
            https://github.com/brain-bbqs-runners/ember-usage-runner/actions/workflows/name-install+packages_archive-ember_runner-typhon_trigger-dispatch.yml
